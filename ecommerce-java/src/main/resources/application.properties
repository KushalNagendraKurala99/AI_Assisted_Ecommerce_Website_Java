# ── Server ────────────────────────────────────────────────────────────────────
server.port=5000

# ── MySQL DataSource (replaces db.py pool config) ─────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── HikariCP Connection Pool (replaces Python pooling.MySQLConnectionPool) ────
spring.datasource.hikari.pool-name=shopai_pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── Ollama LLM (replaces llm.py) ──────────────────────────────────────────────
ollama.base-url=http://localhost:11434
ollama.model=mistral

# ── JSON formatting ────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
